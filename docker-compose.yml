# Local development environment. Works the same on macOS and Ubuntu: nothing runs on the
# host, and Node/npm/Angular CLI are not needed there at all.
#
#   docker compose up --build      bring everything up
#   docker compose logs -f api     logs of one service
#   docker compose down -v         stop and wipe the data
#
# Code enters the container through a bind mount, while node_modules live in named volumes:
# argon2 is a native module, and one built on macOS will not run inside a Linux container.

name: mouse

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The maintenance database the application one is created from. `mouse_trading` itself
      # is created by apps/api/db/init/0001-create-database.sql — see the note in it.
      POSTGRES_DB: postgres
    ports:
      # Host ports can be changed in .env — on a developer machine they are often taken.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # postgres 18+ images keep the data in a subdirectory named after the major version,
      # so /var/lib/postgresql is mounted rather than .../data as it used to be.
      - pgdata:/var/lib/postgresql
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot task: compiles the backend, creates the database (if missing) and applies
  # migrations before api starts. The build comes first because the migration runner is
  # `dist/db/migrate.js` — see docs/adr/0003.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - api_node_modules:/app/apps/api/node_modules
    command: sh -c "npm run build && npm run db:create && npm run db:migrate"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: [.env]
    # The port is published only for requests that bypass the UI: /healthz, curl, a debugger.
    # The browser reaches the API through the same origin as the UI (the ng serve proxy).
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - api_node_modules:/app/apps/api/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - '${WEB_HOST_PORT:-4200}:4200'
    depends_on:
      - api
    volumes:
      - ./:/app
      - web_node_modules:/app/apps/web/node_modules
      # The build cache goes into a volume rather than the host: over virtiofs on macOS it is expensive.
      - web_angular_cache:/app/apps/web/.angular
    restart: unless-stopped

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  web_angular_cache:
