name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything runs in the same images as locally, so "works on my machine" stops being a
# possible diagnosis. The values below are not secrets but CI stubs: config.ts validates
# env at process start, so they are needed even where nothing touches the database.
env:
  CI_ENV_FILE: |
    POSTGRES_USER=ci
    POSTGRES_PASSWORD=ci
    DATABASE_URL=postgres://ci:ci@postgres:5432/mouse_trading
    NODE_ENV=test
    LOG_LEVEL=error
    JWT_SECRET=ci-secret-value-that-is-long-enough-for-hs256
    ADMIN_BOOTSTRAP_EMAIL=admin@example.com
    ADMIN_BOOTSTRAP_NAME=CI
    ADMIN_BOOTSTRAP_PASSWORD=ci-admin-password

jobs:
  api:
    name: api — format, lint, typecheck, deps, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: printf '%s' "$CI_ENV_FILE" > .env
      - run: docker compose build api
      - run: docker compose run --rm --no-deps api npm run format:check
      - run: docker compose run --rm --no-deps api npm run lint
      - run: docker compose run --rm --no-deps api npm run typecheck
      - run: docker compose run --rm --no-deps api npm run deps:check
      # The backend is compiled (docs/adr/0003): everything below runs out of dist/.
      - run: docker compose run --rm --no-deps api npm run build
      # No --no-deps: the repository and schema specs run against a real Postgres, so the
      # step needs the database up. The test database is the `_test` twin of DATABASE_URL
      # and is created and migrated by the run itself.
      - run: docker compose run --rm api npm run test

  web:
    name: web — format, lint, tests, production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: printf '%s' "$CI_ENV_FILE" > .env
      - run: docker compose build web
      - run: docker compose run --rm --no-deps web npm run format:check
      - run: docker compose run --rm --no-deps web npm run lint
      - run: docker compose run --rm --no-deps web npm run test
      - run: docker compose run --rm --no-deps web npm run build

  migrations:
    name: migrations — up, down and a health check against a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: printf '%s' "$CI_ENV_FILE" > .env

      - name: Create the database and apply migrations
        run: docker compose run --rm migrate

      # A migration without a working down is a migration that cannot be rolled back in
      # production. The number of steps is read from the migrations themselves, so a new
      # migration is covered without anyone remembering to edit this file.
      - name: Revert every migration and apply them again
        run: |
          count=$(ls apps/api/db/migrations/*.ts | wc -l | tr -d '[:space:]')
          docker compose run --rm --no-deps api sh -c \
            "for _ in \$(seq 1 $count); do npm run db:migrate:revert || exit 1; done && npm run db:migrate"

      # The only place in CI where the server process actually starts: the composition root,
      # the zod validation of env and the route registration are not exercised by the specs.
      - name: Wait for a healthy api
        run: docker compose up -d --wait --wait-timeout 90 api

      - name: Api logs on failure
        if: failure()
        run: docker compose logs api
