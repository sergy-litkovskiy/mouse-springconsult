name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # The repository is public, so the thread the agent reads may hold anyone's text. This job
  # screens it before the step that hands it to the model alongside the tokens and tools.
  gate:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      # The gate comes from the default branch: on PR review events the working copy is the
      # PR's code, and a PR must not be able to swap out its own check.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/agent-input-gate.sh
          sparse-checkout-cone-mode: false

      # Thread text goes through env, never through ${{ }} inside run: that would be shell injection.
      # Issue and PR comments are not read here: include_comments_by_actor below keeps other
      # people's out of the model. That filter does not cover reviews, so they are read.
      - name: Check untrusted input
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          TRIGGER_TEXT: ${{ github.event.comment.body || github.event.review.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '%s\n' "$TRIGGER_TEXT"
            gh api "repos/$REPO/issues/$NUMBER" --jq '.title, .body // ""'
            if [ "$IS_PR" = true ]; then
              gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[].body'
              gh api --paginate "repos/$REPO/pulls/$NUMBER/comments" --jq '.[].body'
            fi
          } > "$RUNNER_TEMP/agent-input.txt"
          if ! bash scripts/agent-input-gate.sh < "$RUNNER_TEMP/agent-input.txt"; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" \
              -f body="Агента зупинено до запуску: текст у треді не пройшов перевірку. Деталі — у [run]($RUN_URL)."
            exit 1
          fi

  claude:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          include_comments_by_actor: sergy-litkovskiy

          # Commits go through the API tool instead of `git` in Bash, so Bash can be denied outright.
          use_commit_signing: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Written out rather than left to the defaults of the floating @v1 tag. Without Bash the
          # model cannot read the env with the tokens or reach the network. An Edit rule covers
          # Write as well.
          claude_args: >-
            --disallowedTools "Bash,WebFetch,WebSearch,Edit(.github/**),Edit(.claude/**),Edit(**/CLAUDE.md),Edit(AGENTS.md)"

