<div class="suggestion">
  <div class="suggestion__buttons">
    @if (working()) {
      <div class="suggestion__working" [class.suggestion__working--pair]="improvable()">
        <mat-progress-spinner
          mode="indeterminate"
          diameter="24"
          aria-label="Модель готує варіант"
        />
      </div>
    } @else {
      <button
        matIconButton
        type="button"
        [disabled]="!canLaunch()"
        disabledInteractive
        [matTooltip]="canRewrite() ? 'Застосувати як промпт' : rewriteHint()"
        [attr.aria-label]="'Застосувати як промпт: ' + label()"
        data-testid="rewrite"
        (click)="canLaunch() && rewrite.emit()"
      >
        <mat-icon>auto_awesome</mat-icon>
      </button>
      @if (improvable()) {
        <button
          matIconButton
          type="button"
          [disabled]="!canLaunch()"
          disabledInteractive
          [matTooltip]="canRewrite() ? 'Покращити через AI' : rewriteHint()"
          [attr.aria-label]="'Покращити через AI: ' + label()"
          data-testid="improve"
          (click)="canLaunch() && improve.emit()"
        >
          <mat-icon>auto_fix_high</mat-icon>
        </button>
      }
    }
    @if (acceptable()) {
      <button
        matIconButton
        type="button"
        [disabled]="!canAccept()"
        matTooltip="Застосувати для поля ліворуч"
        [attr.aria-label]="'Застосувати для поля ліворуч: ' + label()"
        data-testid="accept"
        (click)="accept.emit()"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
  </div>

  <div class="suggestion__value">
    <span class="suggestion__label">{{ label() }}</span>
    @if (text() === '') {
      <p class="suggestion__empty" data-testid="suggestion-empty">Пропозиції ще немає.</p>
    } @else if (listings(); as listings) {
      <div class="suggestion__range">
        <p class="suggestion__text" data-testid="suggestion-value">{{ text() }}</p>
        <button
          matIconButton
          type="button"
          matTooltip="Оголошення й дата пошуку"
          aria-label="Оголошення й дата пошуку"
          data-testid="price-listings"
          (click)="showListings(listings)"
        >
          <mat-icon>info</mat-icon>
        </button>
      </div>
    } @else {
      <p class="suggestion__text" data-testid="suggestion-value">{{ text() }}</p>
    }
  </div>
</div>
