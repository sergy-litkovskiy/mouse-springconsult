<div class="suggestion">
  <div class="suggestion__buttons">
    <button
      matIconButton
      type="button"
      [disabled]="!canLaunch()"
      disabledInteractive
      [matTooltip]="canRewrite() ? 'Застосувати як промпт' : rewriteHint()"
      [attr.aria-label]="'Застосувати як промпт: ' + label()"
      data-testid="rewrite"
      (click)="canLaunch() && rewrite.emit()"
    >
      <mat-icon>auto_awesome</mat-icon>
    </button>
    @if (improvable()) {
      <button
        matIconButton
        type="button"
        [disabled]="!canLaunch()"
        disabledInteractive
        [matTooltip]="canRewrite() ? 'Покращити через AI' : rewriteHint()"
        [attr.aria-label]="'Покращити через AI: ' + label()"
        data-testid="improve"
        (click)="canLaunch() && improve.emit()"
      >
        <mat-icon>auto_fix_high</mat-icon>
      </button>
    }
    @if (acceptable()) {
      <button
        matIconButton
        type="button"
        [disabled]="!canAccept()"
        matTooltip="Застосувати для поля ліворуч"
        [attr.aria-label]="'Застосувати для поля ліворуч: ' + label()"
        data-testid="accept"
        (click)="accept.emit()"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
  </div>

  <div class="suggestion__value">
    <span class="suggestion__label">{{ label() }}</span>
    @if (text() === '') {
      <p class="suggestion__empty" data-testid="suggestion-empty">Пропозиції ще немає.</p>
    } @else {
      <p class="suggestion__text" data-testid="suggestion-value">{{ text() }}</p>
    }
  </div>
</div>
