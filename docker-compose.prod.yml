# Production on a Hetzner VPS. This file, together with .env, is placed in /opt/mouse —
# no repository is needed on the server, the images come from GitHub Container Registry.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Only 80/443 on caddy are exposed; postgres and api live on the internal network.

name: mouse

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # postgres 18+ images keep the data in a subdirectory named after the major version,
      # so /var/lib/postgresql is mounted rather than .../data as it used to be.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ghcr.io/OWNER/mouse-api:latest}
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:create && npm run db:migrate"
    restart: 'no'

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/mouse-api:latest}
    env_file: [.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One image carries both the Angular static files and Caddy: TLS, /api → api:3000, SPA fallback.
  caddy:
    image: ${WEB_IMAGE:-ghcr.io/OWNER/mouse-web:latest}
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
